  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:940px;">
      <div class="between" style="margin-bottom:14px;flex-wrap:wrap;gap:8px;">
        <div>
          <h2 style="margin:0;font-size:20px;">Inspection Report Preview</h2>
          <span class="hint">Previewing exact formatting as shown in standard report</span>
        </div>
        <div class="row" style="flex-wrap:wrap;gap:8px;">
          <button class="btn btn-primary" id="modalDlPdfBtn">📄 Download PDF</button>
          <button class="btn btn-outline" id="modalPrintBtn">🖨 Print / Save as PDF</button>
          <button class="btn btn-outline" id="modalDlBtn">↓ Download .doc</button>
          <button class="iconbtn" id="modalCloseBtn" style="font-size:20px;">✕</button>
        </div>
      </div>
      <div style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;max-height:70vh;overflow-y:auto;">
        <iframe id="previewIframe" style="width:100%;min-height:800px;border:none;"></iframe>
      </div>
    </div>`;

  document.body.appendChild(overlay);
  const iframe = document.getElementById('previewIframe');
  iframe.srcdoc = html;

  document.getElementById('modalCloseBtn').addEventListener('click', () => overlay.remove());
  document.getElementById('modalDlPdfBtn').addEventListener('click', (e) => downloadPdfReport(r, e.currentTarget));
  document.getElementById('modalPrintBtn')?.addEventListener('click', () => {
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
  });
  document.getElementById('modalDlBtn').addEventListener('click', () => downloadReport(r));
}

// 5. SETTINGS VIEW
function viewSettings(){
  const primaryEmail = getPrimaryApproverEmail();
  const primaryName = getPrimaryApproverName();
  const isDrive = isDriveConnected();

  app.innerHTML = `
  <div class="hero">
    <div class="eyebrow">Application Configuration</div>
    <h1>Distribution &amp; Integrations</h1>
    <p>Configure automated report distribution lists, Google Drive sync persistence, and management approver settings. All changes save automatically.</p>
  </div>

  <!-- Google Drive Storage Integration -->
  <div class="card">
    <div class="between">
      <div>
        <div class="small">Google Drive Storage Integration</div>
        <h2 style="margin:4px 0 2px;">Google Drive Folder: "Reports Data"</h2>
        <p class="hint">Authenticated users automatically sync inspection files to the "Reports Data" folder. Once linked, the connection persists until you choose to disconnect.</p>
      </div>
      <div>
        ${isDrive ? `
          <button class="btn btn-outline" id="settingsSignOut">Disconnect Drive</button>
        ` : `
          <button class="btn btn-drive" id="settingsSignIn">Connect Google Drive</button>
        `}
      </div>
    </div>
    <div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <div>
        ${isDrive ? `
          <span style="color:var(--accent);font-weight:600;">✓ Connected as ${esc(currentUser?.email || 'Authorized Owner')}</span> · Destination: <b>Google Drive &gt; Reports Data</b>
          <div style="color:var(--sub);font-size:12px;margin-top:2px;">Session is maintained permanently across browser restarts until explicit sign out.</div>
        ` : `
          <span style="color:var(--sub);">Not connected to Google Drive. Click "Connect Google Drive" to enable cloud synchronization in "Reports Data".</span>
        `}
      </div>
      ${isDrive ? `<span class="badge b-completed">Active Drive Session</span>` : `<span class="badge b-not_started">Disconnected</span>`}
    </div>
  </div>

  <!-- Management Approval Settings -->
  <div class="card">
    <div class="small">Quality Management Sign-Off</div>
    <h2>Default Approver Profile</h2>
    <p class="hint">Configure the designated quality manager who receives and approves submitted inspection reports.</p>
    <div class="grid2" style="margin-top:14px;">
      <div>
        <label>Approver Full Name</label>
        <input id="setApproverName" value="${esc(primaryName)}" placeholder="e.g. S. Niktinat">
      </div>
      <div>
        <label>Primary Approval Email</label>
        <select id="setPrimaryApproverSelect">
          ${settings.emails.map(e => `<option value="${esc(e)}" ${e === primaryEmail ? 'selected' : ''}>${esc(e)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div style="margin-top:8px;font-size:12px;color:var(--accent);font-weight:600;" id="approverSaveFeedback">
      ✓ Approver details saved automatically.
    </div>
  </div>

  <!-- Report Distribution List -->
  <div class="card">
    <div class="between">
      <div>
        <div class="small">Distribution &amp; Approvals</div>
        <h2>Report Distribution List</h2>
        <p class="hint">Stakeholders and managers on this list are included on submitted inspection records. You can add or delete any email at any time; changes persist automatically.</p>
      </div>
      <div id="distSaveNotice" style="font-size:12px;color:var(--accent);font-weight:600;">
        ✓ Auto-saved
      </div>
    </div>

    <div class="row" style="margin-top:12px;">
      <input id="newDistEmail" placeholder="manager@interqas.com" style="max-width:320px;">
      <button class="btn btn-dark" id="addDistBtn">+ Add Recipient</button>
    </div>

    <ul class="pchip" style="margin-top:16px;">
      ${settings.emails.map(e => {
        const isPrimary = e === primaryEmail;
        return `
        <li style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border-radius:6px;border:1px solid var(--line);">
          <span style="font-weight:${isPrimary?'600':'400'};font-family:monospace;font-size:13px;">${esc(e)}</span>
          ${isPrimary ? `
            <span class="badge b-completed" style="font-size:11px;">★ Default Approver</span>
          ` : `
            <button class="btn btn-outline" data-setprimary="${esc(e)}" style="padding:2px 8px;font-size:11px;">Set as Primary</button>
          `}
          <button class="iconbtn" data-rme="${esc(e)}" title="Delete recipient" style="color:var(--warn);font-size:16px;margin-left:auto;">✕</button>
        </li>`;
      }).join('')}
    </ul>
  </div>

  <!-- Database Persistence & Backup -->
  <div class="card">
    <div class="between">
      <div>
        <div class="small">Data Persistence &amp; Portability</div>
        <h2>Inspection Database Management</h2>
        <p class="hint">All reports, templates, and distribution preferences are stored locally in the browser database and linked to Google Drive.</p>
      </div>
      <div class="row">
        <button class="btn btn-outline" id="exportDbBtn">💾 Export Database (.json)</button>
        <button class="btn btn-outline" id="importDbBtn">📥 Import Database (.json)</button>
        <input type="file" id="dbFileInput" accept=".json" style="display:none;">
      </div>
    </div>
    <div class="grid3" style="margin-top:14px;">
      <div class="card" style="padding:10px;background:var(--bg);border:1px solid var(--line);text-align:center;">
        <div style="font-size:20px;font-weight:bold;color:var(--iqas-blue);">${DB.reports.length}</div>
        <div style="font-size:12px;color:var(--sub);">Inspection Reports</div>
      </div>
      <div class="card" style="padding:10px;background:var(--bg);border:1px solid var(--line);text-align:center;">
        <div style="font-size:20px;font-weight:bold;color:var(--iqas-blue);">${DB.templates.length}</div>
        <div style="font-size:12px;color:var(--sub);">Templates Configured</div>
      </div>
      <div class="card" style="padding:10px;background:var(--bg);border:1px solid var(--line);text-align:center;">
        <div style="font-size:20px;font-weight:bold;color:var(--iqas-blue);">${settings.emails.length}</div>
        <div style="font-size:12px;color:var(--sub);">Distribution Contacts</div>
      </div>
    </div>
  </div>`;

  // Attach event handlers
  document.getElementById('settingsSignIn')?.addEventListener('click', signInGoogle);
  document.getElementById('settingsSignOut')?.addEventListener('click', signOutGoogle);

  // Approver name live change
  document.getElementById('setApproverName')?.addEventListener('input', (e) => {
    const val = e.target.value.trim();
    if(val){
      settings.approverName = val;
      saveSettings();
    }
  });

  // Primary approver select change
  document.getElementById('setPrimaryApproverSelect')?.addEventListener('change', (e) => {
    const val = e.target.value;
    if(val){
      settings.primaryApprover = val;
      saveSettings();
      viewSettings();
    }
  });

  // Add recipient
  const handleAdd = () => {
    const v = document.getElementById('newDistEmail').value.trim();
    if(!v || !v.includes('@')){ alert('Please enter a valid email address.'); return; }
    if(!settings.emails.includes(v)) {
      settings.emails.push(v);
    }
    if(!settings.primaryApprover){
      settings.primaryApprover = v;
    }
    saveSettings();
    saveLocal();
    viewSettings();
  };

  document.getElementById('addDistBtn')?.addEventListener('click', handleAdd);
  document.getElementById('newDistEmail')?.addEventListener('keypress', (e) => {
    if(e.key === 'Enter') handleAdd();
  });

  // Set as primary approver
  app.querySelectorAll('[data-setprimary]').forEach(b => b.addEventListener('click', () => {
    settings.primaryApprover = b.dataset.setprimary;
    saveSettings();
    viewSettings();
  }));

  // Remove recipient (any recipient can be deleted)
  app.querySelectorAll('[data-rme]').forEach(b => b.addEventListener('click', () => {
    const target = b.dataset.rme;
    settings.emails = settings.emails.filter(e => e !== target);
    if(settings.emails.length === 0){
      settings.emails = ['voicu.dragan@interqas.com'];
    }
    if(settings.primaryApprover === target){
      settings.primaryApprover = settings.emails[0];
    }
    saveSettings();
    saveLocal();
    viewSettings();
  }));

  // Database Export
  document.getElementById('exportDbBtn')?.addEventListener('click', () => {
    const backupData = {
      version: 1,
      appName: 'InspectFlow',
      exportedAt: new Date().toISOString(),
      templates: DB.templates,
      reports: DB.reports,
      settings: settings
    };
    const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `InspectFlow_Backup_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // Database Import
  const dbInput = document.getElementById('dbFileInput');
  document.getElementById('importDbBtn')?.addEventListener('click', () => dbInput?.click());
  dbInput?.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        if(!data || typeof data !== 'object') throw new Error('Invalid JSON format');
        if(Array.isArray(data.templates)) DB.templates = data.templates;
        if(Array.isArray(data.reports)) DB.reports = data.reports;
        if(data.settings && typeof data.settings === 'object'){
          if(Array.isArray(data.settings.emails)) settings.emails = data.settings.emails;
          if(data.settings.primaryApprover) settings.primaryApprover = data.settings.primaryApprover;
          if(data.settings.approverName) settings.approverName = data.settings.approverName;
        }
        saveLocal();
        saveSettings();
        alert('Database successfully restored and saved!');
        viewSettings();
      } catch(err) {
        alert('Failed to import database file: ' + err.message);
      }
    };
    reader.readAsText(file);
  });
}

// Master Render Router
function render(){
  renderAuthSection();
  if(state.view === 'home') viewHome();
  else if(state.view === 'dashboard') viewDashboard();
  else if(state.view === 'templates') viewTemplates();
  else if(state.view === 'settings') viewSettings();
  else if(state.view === 'wizard') viewWizard();
}

// Initial bootstrap
loadLocal();
render();
initFirebase();
</script>
</body>
