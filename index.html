<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InspectFlow - Quality Inspection Workflow</title>
<script src="/vendor/html2pdf.bundle.min.js"></script>
<meta name="description" content="Quality inspection workflow application with customizable templates, step-by-step inspection wizard, Google Drive sync, and IQAS downloadable reports.">
<meta property="og:title" content="InspectFlow">
<meta property="og:description" content="Quality inspection workflow application with customizable templates, step-by-step inspection wizard, Google Drive sync, and IQAS downloadable reports.">
<style>
:root{
  --bg:#f7f7f2; --panel:#ffffff; --ink:#14231c; --sub:#5c6b62; --line:#e2e3dd;
  --brand:#16362b; --brand2:#1f4d3c; --accent:#0f7a4d; --accent-bg:#e7f3ec;
  --fail:#c0392b; --fail-bg:#fbeae8; --warn:#b8860b; --warn-bg:#fdf3df;
  --drive-blue:#1a73e8; --iqas-blue:#16365c;
  --radius:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121712; --panel:#1a221c; --ink:#eef1ec; --sub:#9aa79f; --line:#2b342c; --accent-bg:#183527; --fail-bg:#3a2220; --warn-bg:#3a2f16; }
}
:root[data-theme="dark"]{ --bg:#121712; --panel:#1a221c; --ink:#eef1ec; --sub:#9aa79f; --line:#2b342c; --accent-bg:#183527; --fail-bg:#3a2220; --warn-bg:#3a2f16; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
.serif{font-family:Georgia,'Times New Roman',serif;}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;}
.brand .logo{width:36px;height:36px;border-radius:8px;background:var(--iqas-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;box-shadow:0 2px 5px rgba(0,0,0,0.15);}
.brand small{display:block;color:var(--sub);font-weight:400;font-size:11px;}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.navbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 13px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;transition:all 0.2s;}
.navbtn:hover{border-color:var(--brand2);}
.navbtn.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
main{max-width:1150px;margin:0 auto;padding:24px 20px 60px;}
.hero{background:var(--accent-bg);border-radius:var(--radius);padding:24px 24px;margin-bottom:22px;border:1px solid rgba(15,122,77,0.15);}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--accent);font-weight:700;}
h1{margin:6px 0 8px;font-size:28px;font-family:Georgia,serif;color:var(--ink);}
.hero p{color:var(--sub);margin:0;font-size:14px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
.card h2{font-family:Georgia,serif;font-size:20px;margin:2px 0 10px;}
.small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);font-weight:700;}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px;font-weight:600;}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(15,122,77,0.15);}
textarea{resize:vertical;min-height:60px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px;}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:background 0.15s, transform 0.1s;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand2);}
.btn-dark{background:var(--brand2);color:#fff;}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-outline:hover{background:rgba(0,0,0,0.03);border-color:var(--sub);}
.btn-ghost{background:transparent;border:none;color:var(--sub);}
.btn-ghost:hover{color:var(--ink);background:rgba(0,0,0,0.03);}
.btn-drive{background:#1a73e8;color:#fff;}
.btn-drive:hover{background:#1557b0;}
.btn-success{background:#0f7a4d;color:#fff;}
.btn-success:hover{background:#0a5c39;}
.btn-warn{background:#d97706;color:#fff;}
.btn-warn:hover{background:#b45309;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
@media(max-width:640px){.statgrid{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.stat .n{font-size:26px;font-weight:700;font-family:Georgia,serif;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--sub);text-transform:uppercase;font-size:10px;letter-spacing:.05em;padding:8px 8px;border-bottom:1px solid var(--line);}
td{padding:10px 8px;border-bottom:1px solid var(--line);}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.b-submitted{background:var(--warn-bg);color:var(--warn);}
.b-completed{background:var(--accent-bg);color:var(--accent);}
.b-in_progress{background:#e6effa;color:#2a5fa5;}
.b-not_started{background:var(--line);color:var(--sub);}
.wizlayout{display:grid;grid-template-columns:270px 1fr;gap:18px;}
@media(max-width:820px){.wizlayout{grid-template-columns:1fr;}.sidebar{order:2;}}
.sidebar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;height:fit-content;}
.sidestep{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--sub);margin-bottom:2px;}
.sidestep:hover{background:rgba(0,0,0,0.02);}
.sidestep.current{background:var(--accent-bg);color:var(--ink);font-weight:700;}
.sidestep .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}
.sidestep.done .dot{background:var(--accent);border-color:var(--accent);color:#fff;}
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 14px;}
.progress > div{height:100%;background:var(--accent);transition:width 0.3s;}
.chk{border-bottom:1px solid var(--line);padding:14px 10px;border-radius:8px;}
.chk.chk-pass{background:var(--accent-bg);}
.chk.chk-fail{background:var(--fail-bg);}
.chk:last-child{border-bottom:none;}
.chk .txt{font-size:14px;margin-bottom:8px;font-weight:500;}
.res{display:flex;gap:8px;}
.rbtn{padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.rbtn.pass.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.rbtn.fail.on{background:var(--fail);border-color:var(--fail);color:#fff;}
.rbtn.na.on{background:var(--sub);border-color:var(--sub);color:#fff;}
.decisionrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;}
.dbtn{flex:1;min-width:140px;padding:14px;border-radius:8px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;text-align:center;}
.dbtn.on.pass{background:#2e5b32;border-color:#1e3f22;color:#ffffff;}
.dbtn.on.warn{background:#ffc000;border-color:#cca000;color:#000000;}
.dbtn.on.fail{background:#b71c1c;border-color:#8e1414;color:#ffffff;}
.wizfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap;gap:10px;}
.hint{font-size:12px;color:var(--sub);}
.pchip{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0;}
.pchip li{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
.iconbtn{background:none;border:none;color:var(--sub);cursor:pointer;font-size:13px;}
.tplcard{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;}
.emptystate{text-align:center;color:var(--sub);padding:30px 10px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--panel);border-radius:12px;max-width:850px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,0.3);}

/* Official Google Sign In Button */
.gsi-material-button{user-select:none;-moz-user-select:none;-webkit-user-select:none;-ms-user-select:none;-webkit-appearance:none;background-color:#ffffff;background-image:none;border:1px solid #747775;-webkit-border-radius:6px;border-radius:6px;-webkit-box-sizing:border-box;box-sizing:border-box;color:#1f1f1f;cursor:pointer;font-family:'Roboto',arial,sans-serif;font-size:13px;height:36px;letter-spacing:0.25px;outline:none;overflow:hidden;padding:0 12px;position:relative;text-align:center;-webkit-transition:background-color .218s,border-color .218s,box-shadow .218s;transition:background-color .218s,border-color .218s,box-shadow .218s;vertical-align:middle;white-space:nowrap;width:auto;display:inline-flex;align-items:center;}
.gsi-material-button:hover{-webkit-box-shadow:0 1px 2px 0 rgba(60,64,67,.30),0 1px 3px 1px rgba(60,64,67,.15);box-shadow:0 1px 2px 0 rgba(60,64,67,.30),0 1px 3px 1px rgba(60,64,67,.15);border-color:#c4c7c5;background-color:#f8fafd;}
.gsi-material-button .gsi-material-button-icon{height:18px;margin-right:8px;min-width:18px;width:18px;}
.gsi-material-button .gsi-material-button-content-wrapper{align-items:center;display:flex;flex-direction:row;flex-wrap:nowrap;height:100%;justify-content:space-between;position:relative;width:100%;}
.gsi-material-button .gsi-material-button-contents{font-weight:500;}

/* Google Drive Sync Badge */
.drive-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;background:#e8f0fe;color:#1a73e8;border:1px solid #c2d7fa;}
.approval-card{border:2px solid #ffc000;border-radius:var(--radius);padding:18px;background:#fffdf5;margin-bottom:18px;}
.approval-card.approved{border-color:var(--accent);background:#f4fbf7;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">IQAS</div>
    <div>
      InspectFlow
      <small id="syncBadge">Ready</small>
    </div>
  </div>
  <nav>
    <button class="navbtn active" data-view="home">+ New / open</button>
    <button class="navbtn" data-view="dashboard">Dashboard</button>
    <button class="navbtn" data-view="templates">Templates</button>
    <button class="navbtn" data-view="settings">Settings</button>
  </nav>
  <div class="header-actions" id="authSection">
    <!-- Rendered via JS -->
  </div>
</header>
<main id="app"></main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';

// Non-blocking toast notification system
window.alert = function(msg) {
  let toast = document.getElementById('toastNotice');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toastNotice';
    toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10000;background:var(--iqas-blue,#16365c);color:#fff;padding:12px 22px;border-radius:8px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,0.3);transition:opacity 0.25s,transform 0.25s;max-width:90%;text-align:center;pointer-events:none;';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(-10px)';
  }, 3800);
};

// --- DEFAULT ROLLFORM TEMPLATE ---
const DEFAULT_TEMPLATE = {
  id:'tpl_rollform', name:'Rollform Pre-Shipment Inspection', industry:'Utility-scale solar', category:'Rollformed mounting profiles',
  phases:[
    {title:'PPI — Raw material', purpose:'Verify source material, certificates, and traceability.', checkpoints:[
      'Mill / material certificate available (EN 10204-3.1)','Galvanization certificate available (pre-galvanized material)',
      'Material traceability confirmed — MTC per coil / batch','Applicable standard confirmed (EN 10025-2 / EN 10346 / EN ISO 1461)']},
    {title:'DPI — Dimensions', purpose:'Confirm dimensional conformance against drawing.', checkpoints:[
      'PAR document with company stamp / signature present','FSAR agreed and sent if applicable (S3, AQL 0.4, min 2 pcs)',
      'HDG parts: measurements done after galvanization','All samples within drawing tolerances (AQL 0.4 — zero defects allowed)']},
    {title:'DPI — Coating thickness', purpose:'Confirm coating thickness meets standard.', checkpoints:[
      'Digital DFT gauge used (Elcometer® or equivalent)','HDG coating tested per DIN EN ISO 1461 Table 3',
      'Pre-galvanized coating tested per DIN EN ISO 10346','All local thickness values ≥ minimum limit for material thickness',
      'All mean thickness values ≥ mean limit (average of ≥5 readings per part)','Adhesion test (for special coatings)']},
    {title:'Surface properties', purpose:'Inspect surface condition of parts.', checkpoints:[
      'Functional surfaces free of large zinc deposits','No metal exposure on any inspected part',
      'No red rust detected on any part','No white rust detected on any part']},
    {title:'Cut edge treatment', purpose:'Verify treatment of cut and punched edges.', checkpoints:[
      'Laser-cut edges on pre-galvanized parts treated with zinc paste','Saw-cut or drilled holes on pre-galvanized parts treated',
      'Punched holes on material > 3 mm thickness treated','ZM-coated (zinc-magnesium) material > 5 mm treated',
      'Treatment procedure correctly followed','Applied zinc paste coating ≥ 100 μm confirmed']},
    {title:'PSI — Pre-shipment', purpose:'Final product audit before shipment.', checkpoints:[
      'IDT PAR (Product Audit Report) present for the batch','Coating report present for the batch','Twist within limit',
      'Straightness within limit','Certificate of Conformity (COC) present — EN 10204 Type 2.1',
      'All packages stamped or marked by inspector','Colour Code applied correctly','Part marking verified']},
    {title:'Packaging & storage', purpose:'Confirm packaging and storage conditions.', checkpoints:[
      'Packaging safe for personnel — no exposed sharp edges','Parts protected from scratches and movement during transport',
      'Rows and columns separated for ventilation — no plastic foil wrap','Warning label applied to every bundle',
      'Pallet Label / Packaging datasheet provided','Material stored in dry conditions only — no water contact',
      'Loading not performed in bad weather or rain']}
  ]
};

let DB = {templates:[], reports:[]};
let syncMode = 'local', saveTimer = null;
let settings = {
  emails: ['s.niktinat@interqas.com'],
  primaryApprover: 's.niktinat@interqas.com',
  approverName: 'S. Niktinat'
};
let canEditSettings = true;

function getPrimaryApproverEmail(){
  return settings.primaryApprover || (settings.emails && settings.emails[0]) || 's.niktinat@interqas.com';
}

function getPrimaryApproverName(){
  return settings.approverName || 'S. Niktinat';
}

function saveSettings(){
  try{ localStorage.setItem('if_settings', JSON.stringify(settings)); }catch(e){}
}

function isDriveConnected(){
  return !!(currentUser && (cachedAccessToken || localStorage.getItem('if_drive_connected') === 'true' || localStorage.getItem('if_drive_token')));
}

// Firebase & Drive Auth state
let firebaseApp = null;
let auth = null;
let currentUser = null;
let cachedAccessToken = null;
let isSigningIn = false;
let driveFolderId = null;

// Helper functions
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'; }

function loadLocal(){
  try{ DB.templates = JSON.parse(localStorage.getItem('if_templates')||'null') || [DEFAULT_TEMPLATE]; }catch(e){ DB.templates=[DEFAULT_TEMPLATE]; }
  try{ DB.reports = JSON.parse(localStorage.getItem('if_reports')||'null') || []; }catch(e){ DB.reports=[]; }
  DB.reports.forEach(r => {
    (r.phases||[]).forEach(p => {
      (p.checkpoints||[]).forEach(c => {
        c.photos = c.photos || [];
      });
    });
  });
  try{
    const raw = localStorage.getItem('if_settings');
    if(raw){
      const s = JSON.parse(raw);
      if(s && typeof s === 'object'){
        if(Array.isArray(s.emails) && s.emails.length) settings.emails = s.emails;
        if(s.primaryApprover) settings.primaryApprover = s.primaryApprover;
        if(s.approverName) settings.approverName = s.approverName;
      }
    }
  }catch(e){}
  if(!settings.emails || !settings.emails.length){
    settings.emails = ['s.niktinat@interqas.com'];
  }
  if(!settings.primaryApprover || !settings.emails.includes(settings.primaryApprover)){
    settings.primaryApprover = settings.emails[0];
  }
  if(!settings.approverName){
    settings.approverName = 'S. Niktinat';
  }

  // Restore maintained Google Drive authentication session
  try{
    const isConn = localStorage.getItem('if_drive_connected') === 'true';
    cachedAccessToken = localStorage.getItem('if_drive_token') || null;
    driveFolderId = localStorage.getItem('if_drive_folder_id') || null;
    const savedUser = localStorage.getItem('if_drive_user');
    if(savedUser && (cachedAccessToken || isConn)){
      currentUser = JSON.parse(savedUser);
    }
  }catch(e){}
}

function updateSyncBadge(){
  const badge = document.getElementById('syncBadge');
  if(!badge) return;
  if(isDriveConnected()){
    const emailStr = (currentUser && currentUser.email) ? ` (${currentUser.email})` : '';
    badge.textContent = `Drive connected${emailStr}`;
    badge.title = `Saving to Google Drive folder "Reports Data" as ${(currentUser && currentUser.email) || 'owner'}`;
  } else {
    badge.textContent = 'Local storage';
    badge.title = 'Saved locally in browser';
  }
}

function saveLocal(){
  try{ localStorage.setItem('if_templates', JSON.stringify(DB.templates)); }catch(e){}
  try{ localStorage.setItem('if_reports', JSON.stringify(DB.reports)); }catch(e){}
  try{ localStorage.setItem('if_settings', JSON.stringify(settings)); }catch(e){}
}

function saveTemplate(tpl){
  const idx = DB.templates.findIndex(t=>t.id===tpl.id);
  if(idx>-1) DB.templates[idx]=tpl; else DB.templates.push(tpl);
  saveLocal();
}

function deleteTemplate(id){
  DB.templates = DB.templates.filter(t=>t.id!==id);
  saveLocal();
}

function saveReport(r){
  const idx = DB.reports.findIndex(x=>x.id===r.id);
  if(idx>-1) DB.reports[idx]=r; else DB.reports.push(r);
  saveLocal();
  // Auto-sync to Google Drive if connected
  if(!cachedAccessToken) cachedAccessToken = localStorage.getItem('if_drive_token') || null;
  if(cachedAccessToken && !r._isSyncingDrive){
    debouncedSyncReportToDrive(r);
  }
}

let driveSyncTimer = null;
function debouncedSyncReportToDrive(r){
  clearTimeout(driveSyncTimer);
  driveSyncTimer = setTimeout(()=>{
    if(!cachedAccessToken) cachedAccessToken = localStorage.getItem('if_drive_token') || null;
    if(cachedAccessToken){
      uploadReportToDrive(r, cachedAccessToken).catch(err=>console.warn('Background Drive sync notice:', err.message));
    }
  }, 1200);
}

function debouncedSaveReport(r){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveReport(r), 400);
}

// --- GOOGLE DRIVE INTEGRATION ---
async function initFirebase(){
  try {
    const res = await fetch('/firebase-applet-config.json');
    if (!res.ok) throw new Error('No config');
    const config = await res.json();
    firebaseApp = initializeApp(config);
    auth = getAuth(firebaseApp);
    
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        if (!cachedAccessToken) {
          cachedAccessToken = localStorage.getItem('if_drive_token') || null;
        }
        localStorage.setItem('if_drive_user', JSON.stringify({
          email: user.email,
          displayName: user.displayName,
          uid: user.uid
        }));
      } else {
        // If user logged in before and has not signed out, maintain user and token from localStorage
        const savedToken = localStorage.getItem('if_drive_token');
        const savedUser = localStorage.getItem('if_drive_user');
        if (savedToken && savedUser) {
          cachedAccessToken = savedToken;
          try { currentUser = JSON.parse(savedUser); } catch(e){}
        } else {
          currentUser = null;
          cachedAccessToken = null;
        }
      }
      renderAuthSection();
      updateSyncBadge();
    });
  } catch (err) {
    console.warn('Firebase init:', err);
  } finally {
    renderAuthSection();
    updateSyncBadge();
  }
}

async function reacquireDriveToken(){
  if (!auth) return null;
  try {
    const provider = new GoogleAuthProvider();
    provider.addScope('https://www.googleapis.com/auth/drive.file');
    const result = await signInWithPopup(auth, provider);
    const credential = GoogleAuthProvider.credentialFromResult(result);
    if (credential?.accessToken) {
      cachedAccessToken = credential.accessToken;
      currentUser = result.user;
      localStorage.setItem('if_drive_token', cachedAccessToken);
      localStorage.setItem('if_drive_connected', 'true');
      localStorage.setItem('if_drive_user', JSON.stringify({
        email: currentUser.email,
        displayName: currentUser.displayName,
        uid: currentUser.uid
      }));
      renderAuthSection();
      updateSyncBadge();
      return cachedAccessToken;
    }
  } catch (err) {
    console.warn('Re-acquisition of Drive token cancelled or failed:', err);
  }
  return null;
}

async function signInGoogle(){
  if (!auth) {
    alert('Authentication service is initializing. Please try again in a moment.');
    return;
  }
  const provider = new GoogleAuthProvider();
  provider.addScope('https://www.googleapis.com/auth/drive.file');
  isSigningIn = true;
  try {
    const result = await signInWithPopup(auth, provider);
    const credential = GoogleAuthProvider.credentialFromResult(result);
    if (!credential?.accessToken) {
      throw new Error('Access token not granted');
    }
    cachedAccessToken = credential.accessToken;
    currentUser = result.user;
    localStorage.setItem('if_drive_token', cachedAccessToken);
    localStorage.setItem('if_drive_connected', 'true');
    localStorage.setItem('if_drive_user', JSON.stringify({
      email: currentUser.email,
      displayName: currentUser.displayName,
      uid: currentUser.uid
    }));
    alert(`Connected to Google Drive as ${currentUser.email}! This connection will be maintained until you choose to sign out.`);
    renderAuthSection();
    updateSyncBadge();
    render();
  } catch (err) {
    console.error('Sign-in error:', err);
    alert('Google Sign-in was cancelled or encountered an error.');
  } finally {
    isSigningIn = false;
  }
}

async function signOutGoogle(){
  if (!confirm('Disconnect from Google Drive and sign out? You will need to sign in again to sync reports to "Reports Data".')) {
    return;
  }
  try {
    if (auth) await signOut(auth);
  } catch(e){}
  cachedAccessToken = null;
  currentUser = null;
  driveFolderId = null;
  localStorage.removeItem('if_drive_token');
  localStorage.removeItem('if_drive_user');
  localStorage.removeItem('if_drive_folder_id');
  localStorage.removeItem('if_drive_connected');
  updateSyncBadge();
  renderAuthSection();
  render();
  alert('Disconnected from Google Drive.');
}

async function getOrCreateReportsFolder(token){
  if(!token) token = cachedAccessToken || localStorage.getItem('if_drive_token');
  if(driveFolderId) return driveFolderId;
  driveFolderId = localStorage.getItem('if_drive_folder_id') || null;
  if(driveFolderId) return driveFolderId;

  const q = encodeURIComponent("name = 'Reports Data' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
  let res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  if(res.status === 401){
    const refreshed = await reacquireDriveToken();
    if(refreshed){
      token = refreshed;
      res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`, {
        headers: { Authorization: `Bearer ${token}` }
      });
    }
  }
  if(res.ok){
    const data = await res.json();
    if(data.files && data.files.length > 0){
      driveFolderId = data.files[0].id;
      localStorage.setItem('if_drive_folder_id', driveFolderId);
      return driveFolderId;
    }
  }
  // Create folder
  let createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: {
      Authorization: `Bearer ${token}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      name: 'Reports Data',
      mimeType: 'application/vnd.google-apps.folder'
    })
  });
  if(createRes.status === 401){
    const refreshed = await reacquireDriveToken();
    if(refreshed){
      token = refreshed;
      createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name: 'Reports Data',
          mimeType: 'application/vnd.google-apps.folder'
        })
      });
    }
  }
  if(!createRes.ok){
    throw new Error('Could not create Reports Data folder');
  }
  const folderData = await createRes.json();
  driveFolderId = folderData.id;
  localStorage.setItem('if_drive_folder_id', driveFolderId);
  return driveFolderId;
}

async function uploadReportToDrive(report, token){
  if(!token) token = cachedAccessToken || localStorage.getItem('if_drive_token');
  if(!token) throw new Error('Please sign in to Google Drive first.');
  report._isSyncingDrive = true;
  try {
    const folderId = await getOrCreateReportsFolder(token);
    const htmlContent = buildTemplateHtml(report);
    const sanitizedName = (report.header.reportName || 'Inspection_Report').replace(/[^a-zA-Z0-9_-]/g, '_');
    const poPart = (report.header.po || report.id).replace(/[^a-zA-Z0-9_-]/g, '_');
    const filename = `${sanitizedName}_${poPart}.doc`;

    let fileId = report.driveFileId || null;
    if(!fileId){
      const q = encodeURIComponent(`name = '${filename.replace(/'/g, "\\'")}' and '${folderId}' in parents and trashed = false`);
      let checkRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,webViewLink)&spaces=drive`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if(checkRes.status === 401){
        const refreshed = await reacquireDriveToken();
        if(refreshed){
          token = refreshed;
          checkRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,webViewLink)&spaces=drive`, {
            headers: { Authorization: `Bearer ${token}` }
          });
        }
      }
      if(checkRes.ok){
        const checkData = await checkRes.json();
        if(checkData.files && checkData.files.length > 0){
          fileId = checkData.files[0].id;
        }
      }
    }

    const metadata = {
      name: filename,
      mimeType: 'application/msword'
    };
    if(!fileId) {
      metadata.parents = [folderId];
    }

    const boundary = '-------314159265358979323846';
    const delimiter = "\r\n--" + boundary + "\r\n";
    const closeDelim = "\r\n--" + boundary + "--";

    const multipartRequestBody =
      delimiter +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify(metadata) +
      delimiter +
      'Content-Type: application/msword; charset=UTF-8\r\n\r\n' +
      htmlContent +
      closeDelim;

    const url = fileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart&fields=id,name,webViewLink`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink`;

    const method = fileId ? 'PATCH' : 'POST';

    let res = await fetch(url, {
      method: method,
      headers: {
        Authorization: `Bearer ${token}`,
        'Content-Type': `multipart/related; boundary=${boundary}`
      },
      body: multipartRequestBody
    });

    if(res.status === 401){
      const refreshed = await reacquireDriveToken();
      if(refreshed){
        token = refreshed;
        res = await fetch(url, {
          method: method,
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': `multipart/related; boundary=${boundary}`
          },
          body: multipartRequestBody
        });
      }
    }

    if(!res.ok){
      const errText = await res.text();
      throw new Error(`Google Drive API error: ${errText}`);
    }
    const result = await res.json();
    report.driveFileId = result.id;
    report.driveViewLink = result.webViewLink;
    saveLocal();
    return result;
  } finally {
    delete report._isSyncingDrive;
  }
}

async function syncAllReportsToDrive(){
  if(!cachedAccessToken){
    await signInGoogle();
    if(!cachedAccessToken) return;
  }
  let count = 0;
  alert('Syncing all reports to Google Drive folder "Reports Data"…');
  for(const rep of DB.reports){
    try{
      await uploadReportToDrive(rep, cachedAccessToken);
      count++;
    }catch(err){
      console.warn('Sync error for', rep.id, err);
    }
  }
  alert(`Successfully synced ${count} report(s) into Google Drive folder "Reports Data"!`);
  render();
}

        await uploadReportToDrive(rep, cachedAccessToken);
        alert(`Saved "${rep.header.reportName}" to Google Drive folder "Reports Data"!`);
        renderTable();
      }catch(err){
        alert('Upload failed: ' + err.message);
        renderTable();
      }
    }));
  };

  ['fName','fCust','fStatus'].forEach(id => document.getElementById(id).addEventListener('input', renderTable));
  document.getElementById('applyF').addEventListener('click', renderTable);
  document.getElementById('clearF').addEventListener('click', () => {
    document.getElementById('fName').value='';
    document.getElementById('fCust').value='';
    document.getElementById('fStatus').value='';
    renderTable();
  });
  renderTable();
}

  function renderEditor(){
    wrap.innerHTML = `<div class="card">
      <div class="between">
        <div class="small">${id?'Edit Template':'New Template'}</div>
        <button class="btn btn-primary" id="saveTpl">Save Template</button>
      </div>
      <div class="grid3">
        <div><label>Template Name *</label><input id="tName" value="${esc(tpl.name)}" placeholder="e.g. Rollform Pre-Shipment Inspection"></div>
        <div><label>Industry / Sector *</label><input id="tInd" value="${esc(tpl.industry)}" placeholder="e.g. Utility-scale solar"></div>
        <div><label>Category / Product *</label><input id="tCat" value="${esc(tpl.category)}" placeholder="e.g. Rollformed mounting profiles"></div>
      </div>
      <div id="phasesWrap"></div>
      <button class="btn btn-outline" id="addPhase" style="margin-top:14px;">+ Add Inspection Phase</button>

      <div class="between">
        <span class="small" style="font-weight:bold;color:var(--brand2);">Phase ${String(pi+1).padStart(2,'0')}</span>
        <button class="iconbtn" data-rmphase="${pi}">Remove Phase</button>
      </div>
      <label>Phase Title</label><input data-ptitle="${pi}" value="${esc(p.title)}" placeholder="Enter phase title">
      <label>Purpose &amp; Method</label><textarea data-ppurpose="${pi}" placeholder="Purpose, standard method, reference criteria">${esc(p.purpose)}</textarea>
      <label>Checkpoints</label>
      <ul class="pchip" data-cklist="${pi}">
        ${p.checkpoints.map((c,ci) => `<li><span data-ctext="${pi}:${ci}" contenteditable="true" style="outline:none;">${esc(c)}</span><button class="iconbtn" data-rmc="${pi}:${ci}">✕</button></li>`).join('')}
      </ul>
      <button class="btn btn-ghost" data-addc="${pi}" style="margin-top:6px;">+ Add Checkpoint</button>
    </div>`).join('');

    document.getElementById('addPhase').addEventListener('click', () => { tpl.phases.push({title:'',purpose:'',checkpoints:[]}); renderEditor(); });
    pw.querySelectorAll('[data-rmphase]').forEach(b => b.addEventListener('click', () => { tpl.phases.splice(+b.dataset.rmphase,1); renderEditor(); }));
    pw.querySelectorAll('[data-ptitle]').forEach(el => el.addEventListener('input', () => { tpl.phases[+el.dataset.ptitle].title = el.value; }));
    pw.querySelectorAll('[data-ppurpose]').forEach(el => el.addEventListener('input', () => { tpl.phases[+el.dataset.ppurpose].purpose = el.value; }));
    pw.querySelectorAll('[data-addc]').forEach(b => b.addEventListener('click', () => { tpl.phases[+b.dataset.addc].checkpoints.push('New checkpoint requirement'); renderEditor(); }));
    pw.querySelectorAll('[data-rmc]').forEach(b => b.addEventListener('click', () => { const [pi,ci]=b.dataset.rmc.split(':').map(Number); tpl.phases[pi].checkpoints.splice(ci,1); renderEditor(); }));
    pw.querySelectorAll('[data-ctext]').forEach(el => el.addEventListener('input', () => { const [pi,ci]=el.dataset.ctext.split(':').map(Number); tpl.phases[pi].checkpoints[ci]=el.textContent; }));

    document.getElementById('tName').addEventListener('input', e => tpl.name=e.target.value);
    document.getElementById('tInd').addEventListener('input', e => tpl.industry=e.target.value);
    document.getElementById('tCat').addEventListener('input', e => tpl.category=e.target.value);

    document.getElementById('saveTpl').addEventListener('click', () => {
      if(!tpl.name.trim()){ alert('Template name is required.'); return; }
      saveTemplate(tpl);
      alert('Template saved.');
      viewTemplates();
    });
  }
  renderEditor();
}

// 4. WIZARD VIEW (INSPECTION WORKFLOW)
function viewWizard(){
  const r = DB.reports.find(x => x.id === state.currentReportId);
  if(!r){ setView('home'); return; }

  // Steps definition:
  // Step -1: Inspection Header
  // Step 0 .. N-1: Phases
  // Step N: Result & Sign-off
  // Step N+1: Approval Phase (Active once submitted or completed)
  const isSubmittedOrCompleted = r.status === 'submitted' || r.status === 'completed';
  const steps = [
    { title: 'Inspection Header', stepId: -1 },
    ...r.phases.map((p, idx) => ({ title: p.title, stepId: idx })),
    { title: 'Result & Sign-off', stepId: r.phases.length },
    { title: 'Manager Approval', stepId: r.phases.length + 1 }
  ];

  const currentStep = state.wizStep;
  const {t, d} = totalChecks(r);
  const percent = t ? Math.round(d/t*100) : 0;

  const sidebar = `<div class="sidebar">
    <div class="small">Inspection Record</div>
    <h2 style="font-size:17px;margin:4px 0 2px;">${esc(r.header.reportName)}</h2>
    <div class="hint">${esc(r.header.po||'No PO')} · <b>${r.status==='submitted'?'Submitted for Approval':(r.status==='completed'?'Approved & Completed':r.status.replace('_',' '))}</b></div>
    <div class="progress"><div style="width:${percent}%"></div></div>
    <div class="hint" style="margin-bottom:12px;">${d} / ${t} Checks (${percent}%)</div>
    ${steps.map((s, i) => {
      let isDone = false;
      if(s.stepId === -1) isDone = !!(r.header.customer && r.header.inspector);
      else if(s.stepId < r.phases.length) isDone = r.phases[s.stepId].checkpoints.every(c => c.result);
      else if(s.stepId === r.phases.length) isDone = !!r.decision;
      else if(s.stepId === r.phases.length + 1) isDone = (r.status === 'completed');

      const isCurrent = s.stepId === currentStep;
      return `<div class="sidestep ${isCurrent?'current':''} ${isDone?'done':''}" data-step="${s.stepId}">
        <span class="dot">${isDone?'✓':(i+1)}</span>
        <span style="flex:1;">${esc(s.title)}</span>
      </div>`;
    }).join('')}
  </div>`;

  let contentHtml = '';
  if(currentStep === -1){
    contentHtml = headerStepHtml(r);
  } else if(currentStep < r.phases.length){
    contentHtml = phaseStepHtml(r, currentStep);
  } else if(currentStep === r.phases.length){
    contentHtml = signoffStepHtml(r);
  } else {
    contentHtml = approvalStepHtml(r);
  }

  app.innerHTML = `
  <div class="between" style="margin-bottom:14px;">
    <div class="row">
      <button class="btn btn-ghost" id="backHomeBtn">← Workspace</button>
      <button class="btn btn-outline" id="previewLayoutBtn">👁 Preview Report</button>
      <button class="btn btn-outline" id="topPdfBtn">📄 Download PDF</button>
    </div>
    <div class="row">
      ${isDriveConnected() ? `
        <button class="btn btn-drive" id="saveDriveBtn">☁ Save to "Reports Data"</button>
        ${r.driveViewLink ? `<a href="${esc(r.driveViewLink)}" target="_blank" class="drive-badge" style="text-decoration:none;">Open in Drive ↗</a>` : ''}
      ` : `
        <button class="btn btn-outline" id="connectDriveBtn">Link Google Drive</button>
      `}
      <button class="btn btn-primary" id="saveRepBtn">Save Draft</button>
    </div>
  </div>
  ${r.status==='completed' ? '<div class="card" style="background:var(--accent-bg);color:var(--accent);padding:12px 16px;font-weight:600;">✓ This report has been Approved and Completed by Management.</div>' : ''}
  ${r.status==='submitted' ? `<div class="card" style="background:var(--warn-bg);color:var(--warn);padding:12px 16px;font-weight:600;">⏳ Submitted for Manager Approval. Awaiting sign-off by ${esc(r.approval?.approverEmail || getPrimaryApproverEmail())}.</div>` : ''}
  <div class="wizlayout">
    ${sidebar}
    <div>${contentHtml}</div>
  </div>`;

  document.getElementById('backHomeBtn')?.addEventListener('click', () => setView('home'));
  document.getElementById('saveRepBtn')?.addEventListener('click', () => {
    r.updatedAt = Date.now();
    updateStatus(r);
    saveReport(r);
    alert('Report saved.');
  });
  document.getElementById('previewLayoutBtn')?.addEventListener('click', () => showReportModal(r));
  document.getElementById('topPdfBtn')?.addEventListener('click', (e) => downloadPdfReport(r, e.currentTarget));
  document.getElementById('connectDriveBtn')?.addEventListener('click', signInGoogle);
  document.getElementById('saveDriveBtn')?.addEventListener('click', async () => {
    try {
      alert('Uploading report to Google Drive "Reports Data"…');
      await uploadReportToDrive(r, cachedAccessToken);
      alert('Report saved in Google Drive folder "Reports Data"!');
      render();
    } catch(err) {
      alert('Google Drive upload error: ' + err.message);
    }
  });

  app.querySelectorAll('[data-step]').forEach(el => el.addEventListener('click', () => {
    state.wizStep = +el.dataset.step;
    render();
  }));

  wireStepEvents(r, currentStep);
}

function updateStatus(r){
  if(r.status === 'submitted' || r.status === 'completed') return;
  const {t, d} = totalChecks(r);
  if(d === 0 && !r.header.customer) r.status = 'not_started';
  else r.status = 'in_progress';
}

      </div>
    `}

    ${!isApproved ? `
    <div class="wizfoot" style="margin-top:20px;">
      <button class="btn btn-outline" id="prevStepBtn">← Back to Results</button>
      <div class="row">

        ${cachedAccessToken ? `<button class="btn btn-drive" id="saveDriveApprovalBtn">☁ Save to Google Drive</button>` : ''}
      </div>
    </div>
    ` : ''}
  </div>`;
}

// Image Compression & Processing Helper
async function compressImage(fileOrDataUrl, maxWidth = 1280, maxHeight = 960, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxWidth || height > maxHeight) {
        if (width / height > maxWidth / maxHeight) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        } else {
          width = Math.round((width * maxHeight) / height);
          height = maxHeight;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => reject(new Error('Invalid image format'));
    if (typeof fileOrDataUrl === 'string') {
      img.src = fileOrDataUrl;
    } else {
      const reader = new FileReader();
      reader.onload = e => { img.src = e.target.result; };
      reader.onerror = () => reject(new Error('Failed reading image file'));
      reader.readAsDataURL(fileOrDataUrl);
    }
  });
}

// Live Camera Capture Modal
let activeCameraStream = null;
let currentFacingMode = 'environment';

async function openCameraModal(pi, ci, r) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:540px;padding:20px;">
      <div class="between" style="margin-bottom:10px;">
        <h3 style="margin:0;font-size:18px;display:flex;align-items:center;gap:6px;">📷 Capture Checkpoint Photo</h3>
        <button class="iconbtn" id="closeCamBtn" style="font-size:18px;">✕</button>
      </div>
      <p class="hint" style="margin-bottom:12px;font-size:12px;">Checkpoint: ${esc(r.phases[pi].checkpoints[ci].text)}</p>
      
      <div id="camContainer" style="position:relative;background:#000;border-radius:8px;overflow:hidden;min-height:280px;display:flex;align-items:center;justify-content:center;">
        <video id="camVideo" autoplay playsinline style="width:100%;max-height:360px;object-fit:contain;"></video>
        <img id="camSnapshot" style="display:none;width:100%;max-height:360px;object-fit:contain;">
        <div id="camLoading" style="position:absolute;color:#fff;font-size:14px;text-align:center;padding:12px;">Initializing camera…</div>
      </div>

      <div id="camControls" class="between" style="margin-top:14px;flex-wrap:wrap;gap:8px;">
        <button class="btn btn-outline" id="switchCamBtn" title="Switch camera direction">🔄 Switch Camera</button>
        <button class="btn btn-primary" id="snapBtn" style="padding:10px 22px;font-size:14px;font-weight:600;">📸 Snap Photo</button>
        <button class="btn btn-ghost" id="fileFallbackBtn">📁 File Picker</button>
      </div>

      <div id="previewControls" style="display:none;margin-top:14px;">
        <label>Photo Caption / Measurement Note (Optional)</label>
        <input id="photoCaptionInput" placeholder="e.g. Zinc coating thickness measurement 68 µm">
        <div class="between" style="margin-top:12px;">
          <button class="btn btn-outline" id="retakeBtn">↺ Retake</button>
          <button class="btn btn-success" id="savePhotoBtn">✓ Attach Photo</button>
        </div>
      </div>
    </div>`;

  document.body.appendChild(overlay);

  const video = overlay.querySelector('#camVideo');
  const snapshotImg = overlay.querySelector('#camSnapshot');
  const loading = overlay.querySelector('#camLoading');
  const snapBtn = overlay.querySelector('#snapBtn');
  const switchCamBtn = overlay.querySelector('#switchCamBtn');
  const camControls = overlay.querySelector('#camControls');
  const previewControls = overlay.querySelector('#previewControls');
  let capturedDataUrl = null;

  async function startStream() {
    if (activeCameraStream) {
      activeCameraStream.getTracks().forEach(t => t.stop());
    }
    loading.style.display = 'block';
    loading.textContent = 'Accessing camera…';
    try {
      const constraints = {
        video: {
          facingMode: { ideal: currentFacingMode },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };
      activeCameraStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = activeCameraStream;
      video.style.display = 'block';
      snapshotImg.style.display = 'none';
      loading.style.display = 'none';
      snapBtn.disabled = false;
    } catch (err) {
      console.warn('Camera stream error:', err);
      loading.innerHTML = `Camera unavailable or permission denied.<br><span style="font-size:12px;opacity:0.8;">Use the device file picker to take or select a photo.</span>`;
      snapBtn.disabled = true;
    }
  }

  function stopStream() {
    if (activeCameraStream) {
      activeCameraStream.getTracks().forEach(t => t.stop());
      activeCameraStream = null;
    }
  }

  overlay.querySelector('#closeCamBtn').addEventListener('click', () => {
    stopStream();
    overlay.remove();
  });

  switchCamBtn.addEventListener('click', () => {
    currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
    startStream();
  });

  overlay.querySelector('#fileFallbackBtn').addEventListener('click', () => {
    stopStream();
    overlay.remove();
    const fileInput = document.querySelector(`[data-file-target="${pi}:${ci}"]`);
    fileInput?.click();
  });

  snapBtn.addEventListener('click', () => {
    if (!video.videoWidth) return;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    capturedDataUrl = canvas.toDataURL('image/jpeg', 0.82);

    snapshotImg.src = capturedDataUrl;
    snapshotImg.style.display = 'block';
    video.style.display = 'none';
    camControls.style.display = 'none';
    previewControls.style.display = 'block';
  });

  overlay.querySelector('#retakeBtn').addEventListener('click', () => {
    capturedDataUrl = null;
    snapshotImg.style.display = 'none';
    video.style.display = 'block';
    camControls.style.display = 'flex';
    previewControls.style.display = 'none';
  });

  overlay.querySelector('#savePhotoBtn').addEventListener('click', async () => {
    if (!capturedDataUrl) return;
    const caption = overlay.querySelector('#photoCaptionInput').value.trim();
    stopStream();
    overlay.remove();

    alert('Compressing and saving photo…');
    try {
      const compressedUrl = await compressImage(capturedDataUrl, 1280, 960, 0.78);
      const photoItem = {
        url: compressedUrl,
        caption: caption,
        timestamp: Date.now()
      };
      r.phases[pi].checkpoints[ci].photos = r.phases[pi].checkpoints[ci].photos || [];
      r.phases[pi].checkpoints[ci].photos.push(photoItem);
      saveReport(r);
      alert('Photo attached to checkpoint.');
      render();
    } catch (err) {
      alert('Error saving photo: ' + err.message);
    }
  });

  await startStream();
}

// Wire events for wizard steps
function wireStepEvents(r, currentStep){
  if(currentStep === -1){
    // Header inputs
    ['reportName','customer','projectName','po','partNumbers','itemDesc','batchNumber','totalQty','batchQty','sampleSize','inspector','inspectorEmail','location','serviceProvider'].forEach(id => {
      document.getElementById(id)?.addEventListener('input', e => {
        r.header[id] = e.target.value;
        debouncedSaveReport(r);
      });
    });
    document.getElementById('date')?.addEventListener('input', e => {
      r.header.date = e.target.value;
      debouncedSaveReport(r);
    });
    document.getElementById('nextStepBtn')?.addEventListener('click', () => {
      state.wizStep = 0;
      render();
    });
    document.getElementById('sendInspectorBtn')?.addEventListener('click', () => sendToInspectorAction(r));
  } else if(currentStep < r.phases.length){
    const pi = currentStep;
    app.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => {
      const [pI, cI, val] = b.dataset.r.split(':');
      r.phases[+pI].checkpoints[+cI].result = val;
      updateStatus(r);
      saveReport(r);
      render();
    }));
    app.querySelectorAll('[data-note]').forEach(el => el.addEventListener('input', () => {
      const [pI, cI] = el.dataset.note.split(':');
      r.phases[+pI].checkpoints[+cI].note = el.value;
      debouncedSaveReport(r);
    }));
    document.querySelector('[data-secnote]')?.addEventListener('input', e => {
      r.phases[pi].notes = e.target.value;
      debouncedSaveReport(r);
    });

    // Checkpoint Photo Events
    app.querySelectorAll('.btn-cam-capture').forEach(b => b.addEventListener('click', () => {
      const [pI, cI] = b.dataset.target.split(':').map(Number);
      openCameraModal(pI, cI, r);
    }));

    app.querySelectorAll('[data-file-target]').forEach(input => input.addEventListener('change', async e => {
      const [pI, cI] = input.dataset.fileTarget.split(':').map(Number);
      const file = e.target.files?.[0];
      if(!file) return;
      try {
        alert('Compressing and attaching photo…');
        const compressedUrl = await compressImage(file, 1280, 960, 0.78);
        const caption = prompt('Enter a caption or measurement note (optional):') || '';
        r.phases[pI].checkpoints[cI].photos = r.phases[pI].checkpoints[cI].photos || [];
        r.phases[pI].checkpoints[cI].photos.push({
          url: compressedUrl,
          caption: caption.trim(),
          timestamp: Date.now()
        });
        saveReport(r);
        alert('Photo attached to checkpoint.');
        render();
      } catch(err) {
        alert('Failed to process image: ' + err.message);
      }
    }));

    app.querySelectorAll('.btn-url-attach').forEach(b => b.addEventListener('click', () => {
      const [pI, cI] = b.dataset.target.split(':').map(Number);
      const inputUrl = prompt('Enter image URL or Google Drive photo link:');
      if(!inputUrl || !inputUrl.trim()) return;
      const caption = prompt('Enter a caption or measurement note (optional):') || '';
      r.phases[pI].checkpoints[cI].photos = r.phases[pI].checkpoints[cI].photos || [];
      r.phases[pI].checkpoints[cI].photos.push({
        url: inputUrl.trim(),
        caption: caption.trim(),
        timestamp: Date.now()
      });
      saveReport(r);
      alert('Photo URL attached to checkpoint.');
      render();
    }));

    app.querySelectorAll('.btn-rm-photo').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const [pI, cI, phi] = b.dataset.rmPhoto.split(':').map(Number);
      if(confirm('Remove this photo from checkpoint?')){
        r.phases[pI].checkpoints[cI].photos.splice(phi, 1);
        saveReport(r);
        render();
      }
    }));

    app.querySelectorAll('[data-view-img]').forEach(img => img.addEventListener('click', () => {
      openPhotoLightbox(img.dataset.viewImg, img.dataset.viewCaption, img.dataset.viewTitle);
    }));

    document.getElementById('prevStepBtn')?.addEventListener('click', () => {
      state.wizStep = pi - 1;
      render();
    });
    document.getElementById('nextStepBtn')?.addEventListener('click', () => {
      const missing = r.phases[pi].checkpoints.filter(c => (c.result==='Fail'||c.result==='N/A') && !c.note.trim());
      if(missing.length){
        alert(`Add a comment/finding for every Fail or N/A checkpoint before continuing (${missing.length} missing).`);
        return;
      }
      state.wizStep = pi + 1;
      render();
    });
  } else if(currentStep === r.phases.length){
    document.getElementById('finalNotes')?.addEventListener('input', e => {
      r.finalNotes = e.target.value;
      debouncedSaveReport(r);
    });
    app.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
      r.decision = b.dataset.dec;
      saveReport(r);
      render();
    }));
    document.getElementById('prevStepBtn')?.addEventListener('click', () => {
      state.wizStep = r.phases.length - 1;
      render();
    });
    document.getElementById('toApprovalBtn')?.addEventListener('click', () => {
      state.wizStep = r.phases.length + 1;
      render();
    });
    document.getElementById('submitBtn')?.addEventListener('click', () => submitReportForApproval(r));
    document.getElementById('dlPdfBtn')?.addEventListener('click', (e) => downloadPdfReport(r, e.currentTarget));
    document.getElementById('dlBtn')?.addEventListener('click', () => downloadReport(r));
  } else {
    // Approval step
    document.getElementById('prevStepBtn')?.addEventListener('click', () => {
      state.wizStep = r.phases.length;
      render();
    });
    document.getElementById('dlPdfBtn')?.addEventListener('click', (e) => downloadPdfReport(r, e.currentTarget));
    document.getElementById('dlBtn')?.addEventListener('click', () => downloadReport(r));
    document.getElementById('saveDriveApprovalBtn')?.addEventListener('click', async () => {
      try{
        await uploadReportToDrive(r, cachedAccessToken);
        alert('Report saved to Google Drive "Reports Data"!');
        render();
      }catch(err){ alert(err.message); }
    });

    document.getElementById('approveCompleteBtn')?.addEventListener('click', () => {
      const checkbox = document.getElementById('apprSignCheckbox');
      if(checkbox && !checkbox.checked){
        alert('Please check the confirmation box to authorize and complete this report.');
        return;
      }
      const approverName = document.getElementById('apprName')?.value.trim() || getPrimaryApproverName();
      const approverEmail = document.getElementById('apprEmail')?.value.trim() || getPrimaryApproverEmail();
      const comments = document.getElementById('apprComments')?.value.trim();

      r.status = 'completed';
      r.approval = {
        status: 'approved',
        approverName,
        approverEmail,
        approvedAt: Date.now(),
        comments,
        decision: 'Approved'
      };
      r.updatedAt = Date.now();
      saveReport(r);
      alert('Inspection Report APPROVED and marked as COMPLETED!');
      render();
    });

    document.getElementById('rejectRevisionBtn')?.addEventListener('click', () => {
      const comments = document.getElementById('apprComments')?.value.trim();
      if(!comments){
        alert('Please enter revision comments explaining what needs correction.');
        return;
      }
      r.status = 'in_progress';
      r.approval.status = 'rejected';
      r.approval.comments = comments;
      r.updatedAt = Date.now();
      saveReport(r);
      alert('Report status set back to In Progress. Inspector notified for revision.');
      render();
    });
  }
}

// --- SUBMISSION & NOTIFICATIONS ---

async function submitReportForApproval(r){
  const {t, d} = totalChecks(r);
  if(!r.header.customer || !r.header.inspector){
    alert('Please enter Supplier and Inspector in the header before submitting.');
    return;
  }
  if(!r.header.inspectorEmail){
    alert('Please enter the Inspector email address in the header.');
    return;
  }
  if(d < t){
    alert(`All ${t} checkpoints must be evaluated before submitting (${t - d} remaining).`);
    return;
  }
  const missing = r.phases.some(p => p.checkpoints.some(c => (c.result==='Fail'||c.result==='N/A') && !c.note.trim()));
  if(missing){
    alert('Every Fail or N/A checkpoint requires an explanation note before submission.');
    return;
  }
  if(!r.decision){
    alert('Please select an Overall Inspection Decision (PASS, PASS WITH RESERVATIONS, or FAIL).');
    return;
  }

  const targetEmail = getPrimaryApproverEmail();
  const approverName = getPrimaryApproverName();

  r.status = 'submitted';
  r.updatedAt = Date.now();
  r.approval = {
    status: 'pending',
    approverName: approverName,
    approverEmail: targetEmail,
    submittedAt: Date.now(),
    comments: ''
  };
  saveReport(r);

  // Auto-sync to Google Drive
  let driveLink = '';
  if(isDriveConnected()){
    try{
      const driveRes = await uploadReportToDrive(r, cachedAccessToken);
      driveLink = driveRes.webViewLink || '';
    }catch(err){
      console.warn('Drive upload upon submit:', err);
    }
  }

  // Download PDF copy
  downloadPdfReport(r);

  // Dispatch email to target approver with CC to distribution list
  const otherEmails = (settings.emails || []).filter(e => e.toLowerCase() !== targetEmail.toLowerCase());
  const ccParam = otherEmails.length > 0 ? `&cc=${encodeURIComponent(otherEmails.join(','))}` : '';
  const subject = encodeURIComponent(`[SUBMITTED FOR APPROVAL] ${r.header.reportName} - PO: ${r.header.po || 'N/A'}`);
  const bodyText = `Inspection Report Submitted for Management Approval\n\n` +
    `Report: ${r.header.reportName}\n` +
    `Supplier: ${r.header.customer || '-'}\n` +
    `Project: ${r.header.projectName || '-'}\n` +
    `PO Number: ${r.header.po || '-'}\n` +
    `Inspector: ${r.header.inspector} (${r.header.inspectorEmail})\n` +
    `Inspection Decision: ${r.decision}\n` +
    `Date: ${fmtDate(r.header.date)}\n` +
    (otherEmails.length > 0 ? `Distribution (CC): ${otherEmails.join(', ')}\n` : '') +
    (driveLink ? `\nGoogle Drive Report Link: ${driveLink}\n` : `\n(The formatted PDF inspection report has been generated to attach to this email)\n`) +
    `\nPlease review and approve this inspection report in InspectFlow. Once approved, the status will update to COMPLETED.`;

  const mailtoUrl = `mailto:${encodeURIComponent(targetEmail)}?subject=${subject}${ccParam}&body=${encodeURIComponent(bodyText)}`;

  // Show notification modal with mailto trigger & copy draft fallback
  showEmailNoticeModal({
    title: 'Report Submitted for Manager Approval',
    recipient: targetEmail,
    cc: otherEmails.join(', '),
    subject: `[SUBMITTED FOR APPROVAL] ${r.header.reportName}`,
    body: bodyText,
    mailtoUrl: mailtoUrl,
    driveLink: driveLink
  });

  // Navigate to approval step
  state.wizStep = r.phases.length + 1;
  render();
}

// --- REPORT REFORMATTING AS PER PICTURE (TÜV / IQAS STRUCTURE) ---
function buildTemplateHtml(r){
  const {t} = totalChecks(r);
  let passN=0, failN=0, naN=0;
  r.phases.forEach(p => p.checkpoints.forEach(c => {
    if(c.result==='Pass') passN++;
    else if(c.result==='Fail') failN++;
    else if(c.result==='N/A') naN++;
  }));

function downloadReport(r){
  const html = buildTemplateHtml(r);
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const fileName = (r.header.reportName || 'Inspection_Report').replace(/\s+/g,'_') + '_' + (r.header.po || r.id).replace(/\s+/g,'_') + '.doc';
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function ensureHtml2Pdf(){
  if(window.html2pdf) return window.html2pdf;
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/vendor/html2pdf.bundle.min.js';
    s.onload = () => {
      if(window.html2pdf) resolve(window.html2pdf);
      else reject(new Error('html2pdf initialization failed'));
    };
    s.onerror = () => {
      // Fallback to CDN
      const cdn = document.createElement('script');
      cdn.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
      cdn.onload = () => resolve(window.html2pdf);
      cdn.onerror = () => reject(new Error('Could not load html2pdf library'));
      document.head.appendChild(cdn);
    };
    document.head.appendChild(s);
  });
}

function showToast(msg, type='info', duration=3200){
  const toast = document.createElement('div');
  toast.className = 'toast-msg';
  toast.style.position = 'fixed';
  toast.style.bottom = '24px';
  toast.style.right = '24px';
  toast.style.zIndex = '99999';
  toast.style.background = type === 'success' ? '#0f7a4d' : (type === 'error' ? '#c0392b' : '#16365c');
  toast.style.color = '#ffffff';
  toast.style.padding = '12px 18px';
  toast.style.borderRadius = '8px';
  toast.style.boxShadow = '0 6px 16px rgba(0,0,0,0.25)';
  toast.style.fontSize = '13px';
  toast.style.fontWeight = '600';
  toast.style.display = 'flex';
  toast.style.alignItems = 'center';
  toast.style.gap = '8px';
  toast.innerHTML = msg;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.4s ease';
    setTimeout(() => toast.remove(), 400);
  }, duration);
}

async function downloadPdfReport(r, buttonEl = null){
  const originalText = buttonEl ? buttonEl.innerHTML : '';
  if (buttonEl) {
    buttonEl.disabled = true;
    buttonEl.innerHTML = '⏳ Generating PDF…';
  }
  showToast('📄 Generating high-resolution PDF inspection report…', 'info', 4000);

  try {
    await ensureHtml2Pdf();
    if (!window.html2pdf) {
      throw new Error('PDF generator library could not be loaded');
    }

    const htmlStr = buildTemplateHtml(r);
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlStr, 'text/html');

    // Create rendering container positioned at top: 0, left: 0 behind page elements
    const container = document.createElement('div');
    container.id = 'pdf-render-wrapper';
    container.style.position = 'fixed';
    container.style.top = '0';
    container.style.left = '0';
    container.style.width = '794px'; // 210mm at 96 DPI
    container.style.background = '#ffffff';
    container.style.color = '#14231c';
    container.style.boxSizing = 'border-box';
    container.style.zIndex = '-9999';
    container.style.pointerEvents = 'none';
    container.style.margin = '0';
    container.style.padding = '0';

    const originalStyles = doc.querySelector('style')?.innerHTML || '';
    
    // Inner element with positive coordinates and normal flow for html2canvas
    const innerContent = document.createElement('div');
    innerContent.id = 'pdf-content-root';
    innerContent.style.background = '#ffffff';
    innerContent.style.color = '#14231c';
    innerContent.style.fontFamily = 'Arial, Helvetica, sans-serif';
    innerContent.style.fontSize = '9.5pt';
    innerContent.style.padding = '20px 24px';
    innerContent.style.width = '100%';
    innerContent.style.boxSizing = 'border-box';
    innerContent.style.position = 'relative';

    innerContent.innerHTML = `
      <style>
        ${originalStyles}
        #pdf-content-root {
          font-family: Arial, Helvetica, sans-serif !important;
          background: #ffffff !important;
          color: #14231c !important;
          font-size: 9.5pt !important;
          line-height: 1.35 !important;
        }
        #pdf-content-root table {
          border-collapse: collapse !important;
          width: 100% !important;
          margin-bottom: 12px !important;
          font-size: 9pt !important;
          page-break-inside: auto !important;
        }
        #pdf-content-root tr {
          page-break-inside: avoid !important;
        }
        #pdf-content-root th, #pdf-content-root td {
          border: 1px solid #b8c9d9 !important;
          padding: 5px 7px !important;
          text-align: left;
        }
        #pdf-content-root th {
          background-color: #16365c !important;
          color: #ffffff !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        #pdf-content-root .lbl {
          background-color: #eaf1f7 !important;
          color: #16365c !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        #pdf-content-root .banner {
          background-color: #16365c !important;
          color: #ffffff !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        #pdf-content-root .d-pass {
          background-color: #2e5b32 !important;
          color: #ffffff !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        #pdf-content-root .d-warn {
          background-color: #ffc000 !important;
          color: #000000 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        #pdf-content-root .d-fail {
          background-color: #b71c1c !important;
          color: #ffffff !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        #pdf-content-root .page-break {
          page-break-before: always !important;
          margin-top: 14px !important;
          padding-top: 8px !important;
        }
        #pdf-content-root img {
          max-width: 100% !important;
          height: auto !important;
          display: block !important;
        }
      </style>
      ${doc.body.innerHTML}
    `;

    container.appendChild(innerContent);
    document.body.appendChild(container);

    // Pre-load all images so canvas renders all attached photos
    const imgs = Array.from(innerContent.querySelectorAll('img'));
    if (imgs.length > 0) {
      await Promise.all(imgs.map(img => {
        if (img.complete && img.naturalWidth !== 0) return Promise.resolve();
        return new Promise(res => {
          img.onload = res;
          img.onerror = res;
          setTimeout(res, 2000);
        });
      }));
    }

    const sanitizedName = (r.header.reportName || 'Inspection_Report').replace(/[^a-zA-Z0-9_-]/g, '_');
    const poPart = (r.header.po || r.id).replace(/[^a-zA-Z0-9_-]/g, '_');
    const fileName = `${sanitizedName}_${poPart}.pdf`;

    const opt = {
      margin: [8, 8, 8, 8],
      filename: fileName,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        letterRendering: true,
        scrollY: 0,
        scrollX: 0
      },
      jsPDF: {
        unit: 'mm',
        format: 'a4',
        orientation: 'portrait'
      },
      pagebreak: {
        mode: ['css', 'legacy']
      }
    };

    // Render using innerContent which has normal positive coordinates
    await window.html2pdf().set(opt).from(innerContent).save();
    showToast(`✓ PDF report "${fileName}" downloaded successfully!`, 'success');
  } catch (err) {
    console.error('PDF export failed:', err);
    alert('PDF export failed: ' + err.message);
  } finally {
    if (buttonEl) {
      buttonEl.disabled = false;
      buttonEl.innerHTML = originalText;
    }
    const c = document.getElementById('pdf-render-wrapper');
    if (c) c.remove();
  }
}
